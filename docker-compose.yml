version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: quickshare-app
    restart: unless-stopped
    ports:
      - "8000:80"
    environment:
      - DB_HOST=db
      - DB_PASSWORD=secret
      - DB_DATABASE=quickshare
      - DB_USERNAME=quickshare
      - MAIL_HOST=mailpit
      - APP_URL=http://localhost:8000
    depends_on:
      - db

  db:
    image: mysql:8.0
    restart: unless-stopped
    ports:
      - "13306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: secret
      MYSQL_DATABASE: quickshare
      MYSQL_USER: quickshare
      MYSQL_PASSWORD: secret
    volumes:
      - db-data:/var/lib/mysql

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  queue-worker:
    build:
      context: .
      dockerfile: Dockerfile
    image: quickshare-app
    restart: unless-stopped
    command: ["php", "artisan", "queue:work", "--tries=3"]
    environment:
      - DB_HOST=db
      - DB_PASSWORD=secret
      - DB_DATABASE=quickshare
      - DB_USERNAME=quickshare
    depends_on:
      - app
      - db

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    image: quickshare-app
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    environment:
      - DB_HOST=db
      - DB_PASSWORD=secret
      - DB_DATABASE=quickshare
      - DB_USERNAME=quickshare
    depends_on:
      - app
      - db

volumes:
  db-data:
